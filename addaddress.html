<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Alamat Baru</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: sans-serif; background: #f3f4f6; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        h3 { margin-top: 0; text-align: center; color: #1f2937; }
        
        input, textarea, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; }
        label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; }
        
        #map { height: 250px; width: 100%; border-radius: 8px; margin-bottom: 15px; z-index: 1;}
        button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h3>📍 Tambah Alamat Baru</h3>

    <label>Label Alamat (Contoh: Rumah, Kantor)</label>
    <input type="text" id="label" placeholder="Rumah / Kantor / Sekolah">

    <label>Kota / Kabupaten</label>
    <select id="kota" onchange="checkKota()">
        <option value="" disabled selected>Pilih Kota</option>
        <option value="Kota Makassar">Kota Makassar</option>
        <option value="Kabupaten Pinrang">Kabupaten Pinrang</option>
        </select>

    <div id="pinrangArea" class="hidden">
        <select id="kecamatan" onchange="loadDesa()"><option>Pilih Kecamatan</option></select>
        <select id="desa" style="margin-top: 10px;"><option>Pilih Desa</option></select>
    </div>

    <label>Detail Jalan / Patokan</label>
    <textarea id="detail" rows="2" placeholder="Jalan Mawar No 5, Pagar Hitam..."></textarea>

    <label>Titik Peta (Geser Pin)</label>
    <div id="map"></div>
    <button onclick="kirimData()">✅ SIMPAN ALAMAT</button>
</div>

<script>
    let tg = window.Telegram.WebApp; tg.expand();

    // SETUP PETA
    const defaultLat = -3.7995; const defaultLng = 119.6464; 
    var map = L.map('map').setView([defaultLat, defaultLng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    var marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);

    // DATA PINRANG (Sederhana)
    const dataPinrang = { "Kecamatan Matirro Sompe": ["Kelurahan Langnga", "Desa Mattirotasi"], "Kecamatan Suppa": ["Kelurahan Watang Suppa", "Desa Lero"] }; 
    // ... (Masukkan data lengkap kecamatan Anda di sini seperti file sebelumnya) ...

    function checkKota() {
        document.getElementById('pinrangArea').style.display = (document.getElementById('kota').value === "Kabupaten Pinrang") ? "block" : "none";
        // ... (Logika populate kecamatan sama seperti sebelumnya) ...
    }
    // ... (Logika populate desa sama seperti sebelumnya) ...

    function kirimData() {
        let label = document.getElementById("label").value;
        let kota = document.getElementById("kota").value;
        let detail = document.getElementById("detail").value;
        let lat = marker.getLatLng().lat;
        let lng = marker.getLatLng().lng;

        if(!label || !kota || !detail) { tg.showAlert("Lengkapi data!"); return; }

        let fullAddr = detail + ", " + kota;
        // Logic gabung kecamatan jika Pinrang...

        let data = {
            tipe: "tambah_alamat",  // <--- PENANDA KHUSUS
            label: label,
            alamat: fullAddr,
            lat: lat,
            long: lng
        };
        tg.sendData(JSON.stringify(data));
    }
</script>
</body>
</html>
