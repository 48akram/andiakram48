<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Ongkir Kurir</title>
    <style>
        /* --- CSS DASAR --- */
        body { margin: 0; padding: 0; background-color: #f4f6f8; font-family: "Helvetica Neue", Arial, sans-serif; }
        #kurir-widget { max-width:720px; margin:20px auto; padding:0; background: #fff; }
        #kurir-widget * { box-sizing: border-box; }
        
        .card { padding: 15px; border: none; }
        h2 { margin:0 0 14px 0; font-size:20px; text-align:center; color:#1f2d3d; }
        
        .form-group { margin-bottom:14px; }
        label { display:block; font-weight:600; margin-bottom:6px; color:#3b4a59; font-size:14px; }
        
        input[type="number"], input[type="text"] {
            width:100%; padding:10px 12px; border-radius:8px; border:1px solid #dfe7ef; font-size:14px;
        }
        
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .helper { font-size:12px; color:#667583; margin-top:4px; }
        .tandaku { color: #DC143C; }
        .checkbox-label, .radio-label { display:flex; gap:8px; align-items:center; font-weight:500; color:#2f3f4f; cursor: pointer; }
        .inline { display:inline-flex; gap:12px; flex-wrap:wrap; }

        /* Tombol Utama */
        .cek-button {
            display:block; width:100%; padding:14px; background:#2476f7; color:#fff; 
            border:none; border-radius:8px; font-weight:700; cursor:pointer; font-size: 16px;
            transition: background 0.3s;
        }
        .cek-button:hover { background:#0f63e6; }
        .cek-button.ready-to-send { background: #28a745; }

        /* Hasil */
        .tarif { margin-top:18px; font-size:24px; font-weight:800; color:#17325a; text-align: center; }
        .rincian { margin-top:12px; font-size:14px; color:#334455; line-height:1.6; border-top: 1px dashed #ccc; padding-top:10px; }

        /* Panel Collapsible */
        .panel { border:1px solid #e6eef6; border-radius:8px; background:#fbfdff; margin:10px 0; }
        .panel-header { display:flex; justify-content:space-between; padding:10px; cursor:pointer; border-bottom:1px dashed #ccc; }
        .panel-title { font-weight:600; color: #DC143C; }
        .panel-toggle { border:1px solid #cfe8ff; background:transparent; padding:4px 10px; border-radius:6px; font-size:12px; cursor:pointer; }
        .panel-content { padding:10px; overflow:hidden; transition: max-height 0.3s ease; }
        .panel.collapsed .panel-content { max-height:0; padding:0; border:none; }
        .panel.collapsed .panel-header { border-bottom: none; }

        @media (max-width:640px) {
            #kurir-widget { margin:0; }
            .card { border-radius:0; }
        }
    </style>
</head>
<body>

<div id="kurir-widget">
  <div class="card">
    <h2>Hitung Ongkir</h2>

    <div class="form-group">
      <label><span class="tandaku">*</span>Total Jarak (KM)</label>
      <input id="jarakTotal" placeholder="Contoh: 4.5" type="number" step="0.1" inputmode="decimal" />
      <div class="helper">Masukkan jarak total dari titik jemput sampai tujuan akhir.</div>
    </div>

    <div class="form-group">
      <div class="grid-2">
        <div>
          <label>Titik Online</label>
          <input id="titikOnline" placeholder="Jml (x4rb)" type="number" inputmode="numeric" />
        </div>
        <div>
          <label>Titik Offline</label>
          <input id="titikOffline" placeholder="Jml (x5rb)" type="number" inputmode="numeric" />
        </div>
      </div>
      <div class="helper">Kosongkan jika hanya 1 titik antar.</div>
    </div>

    <div class="form-group">
      <label><span class="tandaku">*</span>Lokasi Jemput</label>
      <div class="inline">
        <label class="radio-label"><input checked name="zona" type="radio" value="0" /> Dalam Kota</label>
        <label class="radio-label"><input name="zona" type="radio" value="luar" /> Luar Batas (+2rb/km)</label>
      </div>
      <input id="jarakZonaLuar" placeholder="Jarak dari batas kota (km)" style="display: none; margin-top:8px;" type="number" />
    </div>

    <div class="form-group">
      <label>Waktu Tunggu (Menit)</label>
      <input id="waktuTunggu" placeholder="Gratis 9 menit awal" type="number" />
    </div>

    <div class="panel collapsed" id="panel-opsi">
      <div class="panel-header">
        <div class="panel-title">Biaya Tambahan & Belanja</div>
        <button class="panel-toggle" type="button">Buka</button>
      </div>
      <div class="panel-content">
        
        <div class="form-group">
            <label>Cuaca</label>
            <div class="inline">
              <label class="radio-label"><input checked name="cuaca" type="radio" value="none" /> Normal</label>
              <label class="radio-label"><input name="cuaca" type="radio" value="hujan" /> Hujan (+5rb)</label>
            </div>
        </div>

        <div class="form-group">
            <label>Jasa Belanja</label>
            <div class="grid-2">
                <input id="itemPasar" placeholder="Pasar Biasa (x750)" type="number" />
                <input id="itemPasarKhusus" placeholder="Pasar Khusus (x1250)" type="number" />
                <input id="itemMall" placeholder="Mall (x3500)" type="number" />
                <input id="itemIndo" placeholder="Indomaret (x500)" type="number" />
            </div>
        </div>

        <div class="form-group">
            <label>Layanan Lain</label>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                <label class="checkbox-label"><input id="cekFoto" type="checkbox" /> Foto Belanja (+3rb)</label>
                <label class="checkbox-label"><input id="cekParkir" type="checkbox" /> Parkir (+2rb)</label>
                <label class="checkbox-label"><input id="cekKFC" type="checkbox" /> KFC/Mcd (+2rb)</label>
                <label class="checkbox-label"><input id="cekGacoan" type="checkbox" /> Gacoan (+2rb)</label>
                <label class="checkbox-label"><input id="cekRS" type="checkbox" /> Masuk RS (+2rb)</label>
                <label class="checkbox-label"><input id="cekJalan" type="checkbox" /> Jalan Rusak (+5rb)</label>
            </div>
        </div>
      </div>
    </div>

    <button class="cek-button" id="btnHitung" type="button">CEK ONGKIR</button>

    <div class="tarif" id="hasilTarif">Rp -</div>
    <div aria-live="polite" class="rincian" id="rincianTarif"></div>
  </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
  const tg = window.Telegram.WebApp;
  tg.expand();
  const urlParams = new URLSearchParams(window.location.search);
  const orderID = urlParams.get('oid') || "0"; 

  // Selectors
  const root = document.getElementById('kurir-widget');
  const btnHitung = document.getElementById('btnHitung');
  const hasilEl = document.getElementById('hasilTarif');
  const rincianEl = document.getElementById('rincianTarif');
  
  // Inputs
  const el = {
      jarak: document.getElementById('jarakTotal'),
      online: document.getElementById('titikOnline'),
      offline: document.getElementById('titikOffline'),
      zonaLuar: document.getElementById('jarakZonaLuar'),
      tunggu: document.getElementById('waktuTunggu'),
      // Belanja
      psBiasa: document.getElementById('itemPasar'),
      psKhusus: document.getElementById('itemPasarKhusus'),
      mall: document.getElementById('itemMall'),
      indo: document.getElementById('itemIndo'),
      // Checkbox
      foto: document.getElementById('cekFoto'),
      parkir: document.getElementById('cekParkir'),
      kfc: document.getElementById('cekKFC'),
      gacoan: document.getElementById('cekGacoan'),
      rs: document.getElementById('cekRS'),
      jalan: document.getElementById('cekJalan')
  };

  // Toggle Zona Input
  const zonaRadios = document.getElementsByName('zona');
  zonaRadios.forEach(r => r.addEventListener('change', () => {
      el.zonaLuar.style.display = (r.value === 'luar') ? 'block' : 'none';
  }));

  // --- LOGIKA UTAMA ---

  function hitungBase(km) {
    let base = 0;
    // Tarif Dasar Normal (Siang)
    // Menggunakan logika: 0-2km: 8rb, lalu naik bertahap
    if (km <= 2.0) base = 8000;
    else if (km <= 3.0) base = 10000;
    else if (km <= 4.0) base = 12000;
    else if (km <= 5.0) base = 14000;
    else if (km <= 6.0) base = 16000;
    else {
        // Diatas 6KM (Siang)
        base = 16000 + Math.ceil(km - 6.0) * 2500;
    }
    return base;
  }

  function getNightSurcharge(hour, km) {
      // Mengembalikan object { fee: 0, label: "" }
      let fee = 0;
      let label = "";

      // 1. JAM 18.00 - 21.59 (Malam Awal)
      if (hour >= 18 && hour <= 21) {
          // <= 4km: Rp 0
          // > 4km: Rp 800/km
          // > 15km: Rp 1.000/km (Graduated/Bertingkat)
          if (km > 4) {
             let sisa = km - 4; // Jarak yang kena cas
             
             // Cek jika tembus 15km
             if (sisa > 11) { // 15 - 4 = 11 km pertama kena 800
                 fee += 11 * 800; // 8.800
                 let sisaJauh = sisa - 11;
                 fee += sisaJauh * 1000;
             } else {
                 fee += sisa * 800;
             }
             label = "Malam (18-22)";
          }
      } 
      // 2. JAM 22.00 - 22.59
      else if (hour === 22) {
          // Base 4km pertama: Rp 4.000
          fee += 4000; 
          
          if (km > 4) {
              let sisa = km - 4;
              // > 10km tarif 1000, 4-10 tarif 800
              if (sisa > 6) { // 10 - 4 = 6 km kena 800
                  fee += 6 * 800;
                  let sisaJauh = sisa - 6;
                  fee += sisaJauh * 1000;
              } else {
                  fee += sisa * 800;
              }
          }
          label = "Malam (22:00)";
      }
      // 3. JAM 23.00 - 23.59
      else if (hour === 23) {
          // Base 4km: Rp 5.000
          fee += 5000;
          if (km > 4) {
              let sisa = km - 4;
              fee += sisa * 1000; // >4km: 1.000/km
          }
          label = "Malam (23:00)";
      }
      // 4. JAM 00.00 - 04.59 (Tengah Malam/Subuh)
      // *Saya gabungkan jam 00 ke sini karena user skip 00, asumsi ikut tarif mahal*
      else if (hour >= 0 && hour <= 4) {
          // Base 4km: Rp 10.000
          fee += 10000;
          if (km > 4) {
              let sisa = km - 4;
              fee += sisa * 1500; // >4km: 1.500/km
          }
          label = "Subuh (00-05)";
      }
      // 5. JAM 05.00 - 05.59
      else if (hour === 5) {
          // Base 4km: Rp 5.000
          fee += 5000;
          if (km > 4) {
              let sisa = km - 4;
              fee += sisa * 1000; // >4km: 1000/km
          }
          label = "Pagi Buta (05:00)";
      }
      // 6. JAM 06.00 - 06.59
      else if (hour === 6) {
          fee += 4000; // Flat +4.000
          label = "Pagi (06:00)";
      }

      return { amount: Math.ceil(fee), name: label };
  }

  function hitung() {
      // A. MODE KIRIM DATA
      if (btnHitung.classList.contains('ready-to-send')) {
          const h = hasilEl.innerText.replace(/[^0-9]/g, '');
          const r = rincianEl.innerText.replace(/\n/g, " , ");
          tg.sendData(h + "|" + r + "|" + orderID);
          tg.close();
          return;
      }

      // B. MODE HITUNG
      let tarif = 0;
      let breakdown = [];
      rincianEl.innerHTML = '';

      // 1. Jarak Dasar
      const km = parseFloat(el.jarak.value.replace(',', '.') || 0);
      if (km <= 0) { alert("Masukkan Jarak Total (KM)"); return; }
      
      const base = hitungBase(km);
      tarif += base;
      breakdown.push({ label: `Jarak Dasar (${km}km)`, val: base });

      // 2. Titik Tambahan
      const qtyOn = parseInt(el.online.value || 0);
      const qtyOff = parseInt(el.offline.value || 0);
      
      if(qtyOn > 0) {
          const b = qtyOn * 4000; // Tarif Online: 4K
          tarif += b; breakdown.push({ label: `Titik Online x${qtyOn}`, val: b });
      }
      if(qtyOff > 0) {
          const b = qtyOff * 5000; // Tarif Offline: 5K
          tarif += b; breakdown.push({ label: `Titik Offline x${qtyOff}`, val: b });
      }

      // 3. Logika Waktu (Kompleks)
      const now = new Date();
      const hour = now.getHours();
      // Debug Hour: const hour = 23; // Coba ubah ini manual untuk tes
      
      const nightData = getNightSurcharge(hour, km);
      if (nightData.amount > 0) {
          tarif += nightData.amount;
          breakdown.push({ label: nightData.name, val: nightData.amount });
      }

      // 4. Cuaca
      const cuaca = document.querySelector('input[name="cuaca"]:checked').value;
      if (cuaca === 'hujan') {
          // Flat 5000 untuk hujan
          tarif += 5000;
          breakdown.push({ label: 'Handling Hujan', val: 5000 });
      }

      // 5. Zona Luar
      const zona = document.querySelector('input[name="zona"]:checked').value;
      if (zona === 'luar') {
          const jz = parseFloat(el.zonaLuar.value || 0);
          if (jz > 0) {
              const b = Math.max(2000, jz * 2000); // 2000 per km luar
              tarif += b; breakdown.push({ label: `Luar Batas (${jz}km)`, val: b });
          }
      }

      // 6. Belanja & Layanan
      // Foto
      if (el.foto.checked) { tarif+=3000; breakdown.push({label:'Jasa Foto Belanja', val:3000}); }
      
      // Item Belanja
      const pB = parseInt(el.psBiasa.value || 0);
      if(pB>0) { const b=pB*750; tarif+=b; breakdown.push({label:`Pasar Biasa (${pB})`, val:b}); }
      
      const pK = parseInt(el.psKhusus.value || 0);
      if(pK>0) { const b=pK*1250; tarif+=b; breakdown.push({label:`Pasar Khusus (${pK})`, val:b}); }
      
      const mall = parseInt(el.mall.value || 0);
      if(mall>0) { const b=mall*3500; tarif+=b; breakdown.push({label:`Mall (${mall})`, val:b}); }
      
      const indo = parseInt(el.indo.value || 0);
      if(indo>0) { const b=indo*500; tarif+=b; breakdown.push({label:`Indomaret (${indo})`, val:b}); }

      // Lainnya
      if (el.parkir.checked) { tarif+=2000; breakdown.push({label:'Parkir', val:2000}); }
      if (el.kfc.checked) { tarif+=2000; breakdown.push({label:'KFC/Mcd', val:2000}); }
      if (el.gacoan.checked) { tarif+=2000; breakdown.push({label:'Gacoan', val:2000}); }
      if (el.rs.checked) { tarif+=2000; breakdown.push({label:'Rumah Sakit', val:2000}); }
      if (el.jalan.checked) { tarif+=5000; breakdown.push({label:'Jalan Rusak', val:5000}); }

      // 7. Waktu Tunggu
      const w = parseInt(el.tunggu.value || 0);
      if (w > 9) {
          const blocks = Math.ceil((w - 9) / 10);
          const b = blocks * 2000;
          tarif += b;
          breakdown.push({ label: `Tunggu ${w} mnt`, val: b });
      }

      // Render
      const finalPrice = Math.ceil(tarif / 1000) * 1000;
      hasilEl.innerText = "Rp " + finalPrice.toLocaleString('id-ID');
      
      rincianEl.innerHTML = breakdown.map(x => 
          `<div style="display:flex; justify-content:space-between;">
              <span>${x.label}</span> <strong>Rp ${x.val.toLocaleString('id-ID')}</strong>
           </div>`
      ).join('');

      // Ubah Tombol
      btnHitung.innerText = "KIRIM ONGKIR KE CHAT";
      btnHitung.classList.add('ready-to-send');
  }

  // Event Listeners
  btnHitung.addEventListener('click', hitung);

  // Reset logic
  const inputs = root.querySelectorAll('input');
  inputs.forEach(i => i.addEventListener('input', () => {
      if (btnHitung.classList.contains('ready-to-send')) {
          btnHitung.innerText = "CEK ONGKIR";
          btnHitung.classList.remove('ready-to-send');
      }
  }));

  // Collapsible
  const panel = document.getElementById('panel-opsi');
  panel.querySelector('.panel-header').addEventListener('click', () => {
      panel.classList.toggle('collapsed');
      panel.querySelector('.panel-toggle').innerText = panel.classList.contains('collapsed') ? "Buka" : "Tutup";
  });

})();
</script>
</body>
</html>
