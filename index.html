<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cek Ongkir Kurir Base</title>
    <style>
        /* --- RESET & VARIABLES --- */
        :root {
            --primary: #2476f7;
            --primary-dark: #0f63e6;
            --success: #28a745;
            --text-main: #1f2d3d;
            --text-sub: #52606d;
            --border: #eef2f7;
            --bg: #f8f9fa;
            --danger: #e03131;
        }
        
        /* FIX INPUT MELEBAR */
        *, *::before, *::after { box-sizing: border-box; }

        body { margin: 0; padding: 0; background-color: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
        
        /* --- LAYOUT UTAMA --- */
        #kurir-widget { max-width: 600px; margin: 0 auto; background: #fff; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .container { padding: 20px; }
        
        /* --- TYPOGRAPHY --- */
        h2 { margin: 0 0 20px 0; font-size: 22px; text-align: center; color: var(--text-main); font-weight: 700; letter-spacing: -0.5px; }
        .section-title { margin-top: 25px; margin-bottom: 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #9aa5b1; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .helper { font-size: 11px; color: #8898aa; margin-top: 2px; }

        /* --- FORMS & INPUTS --- */
        .form-group { margin-bottom: 16px; width: 100%; }
        label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--text-sub); font-size: 14px; }
        .tandaku { color: var(--danger); }
        
        /* Input & Select Styling */
        input[type="number"], input[type="text"], select {
            width: 100%; 
            padding: 12px 14px; border-radius: 10px; border: 1px solid #dfe3e8; 
            font-size: 16px; background: #fff; transition: border 0.2s, box-shadow 0.2s;
            -moz-appearance: textfield; 
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(36,118,247,0.1); }

        /* Grid Layout */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* --- PILIHAN (RADIO & CHECKBOX) --- */
        .radio-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .radio-card { flex: 1; min-width: 120px; position: relative; }
        .radio-card input { position: absolute; opacity: 0; cursor: pointer; }
        .radio-card label {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px; background: #f4f6f8; border: 1px solid transparent; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text-sub); transition: all 0.2s;
        }
        .radio-card input:checked + label { background: #ebf4ff; color: var(--primary); border-color: var(--primary); }

        /* Checkbox List Styling */
        .check-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .check-item label { 
            display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 500; 
            padding: 8px; border-radius: 6px; 
        }

        /* --- COLLAPSIBLE PANEL --- */
        .panel { background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 15px; }
        .panel-header { padding: 12px 15px; background: #fcfcfc; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .panel-title-text { font-weight: 600; color: var(--text-main); font-size: 14px; }
        .panel-content { padding: 0 15px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; }
        .panel.open .panel-content { padding: 15px; max-height: 1500px; }

        /* --- MAP CONTAINER --- */
        .map-toggle-btn {
            background: #eef2f7; color: var(--text-sub); border: none; padding: 8px 12px; 
            border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 10px; width: 100%;
        }
        .map-frame { width: 100%; height: 300px; border: 0; border-radius: 8px; margin-bottom: 15px; display: none; }

        /* --- BUTTON & RESULT --- */
        .bottom-action { margin-top: 25px; padding-top: 20px; border-top: 2px dashed #eef2f7; }
        .cek-button {
            display: block; width: 100%; padding: 16px; background: var(--primary); color: #fff;
            border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(36,118,247,0.25); transition: transform 0.1s, background 0.2s;
        }
        .cek-button:active { transform: scale(0.98); }
        .cek-button.ready-to-send { background: var(--success); box-shadow: 0 4px 6px rgba(40,167,69,0.25); }

        .tarif-display { text-align: center; margin-top: 20px; }
        .tarif-value { font-size: 32px; font-weight: 800; color: var(--text-main); letter-spacing: -1px; }
        .rincian-box { margin-top: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px; font-size: 14px; color: var(--text-sub); }
        .rincian-row { display: flex; justify-content: space-between; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed #e1e4e8; }
        .rincian-row:last-child { border-bottom: none; margin-bottom: 0; }
        .rincian-val { font-weight: 700; color: var(--text-main); }
    </style>
</head>
<body>

<div id="kurir-widget">
    <div class="container">
        <h2>Hitung Ongkir</h2>

        <button class="map-toggle-btn" type="button" onclick="toggleMap()">📍 Lihat Peta Wilayah Tarif</button>
        <iframe class="map-frame" id="myMap" src="https://www.google.com/maps/d/embed?mid=1bHr_0ezAlukVPCDiWSs22t6sSD-XAA8&ehbc=2E312F"></iframe>

        <div class="form-group">
            <label>Tarif Dasar (Sesuai Wilayah Jemput) <span class="tandaku">*</span></label>
            <select id="tarifDasar">
                <option value="8000">Rp 8.000 (Zona 0-2 KM)</option>
                <option value="10000">Rp 10.000 (Zona 3 KM)</option>
                <option value="12000">Rp 12.000 (Zona 4 KM)</option>
                <option value="14000">Rp 14.000 (Zona 5 KM)</option>
                <option value="16000">Rp 16.000 (Zona 6 KM)</option>
                <option value="18000">Rp 18.000 (Zona 7 KM)</option>
                <option value="20000">Rp 20.000 (Zona Jauh)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Jarak Pengantaran (KM) <span class="tandaku">*</span></label>
            <input id="jarakTotal" type="number" step="0.1" inputmode="decimal" placeholder="0.0" style="font-size: 20px; font-weight: bold; color: #2476f7;">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Titik Online (4rb)</label>
                <input id="titikOnline" type="number" inputmode="numeric" placeholder="0">
            </div>
            <div class="form-group">
                <label>Titik Offline (5rb)</label>
                <input id="titikOffline" type="number" inputmode="numeric" placeholder="0">
            </div>
        </div>

        <div class="form-group" style="margin-top: 20px;">
            <label>Cuaca</label>
            <div class="radio-group">
                <div class="radio-card">
                    <input type="radio" name="cuaca" value="none" id="c_normal" checked>
                    <label for="c_normal">☀️ Normal</label>
                </div>
                <div class="radio-card">
                    <input type="radio" name="cuaca" value="hujan" id="c_hujan">
                    <label for="c_hujan">🌧️ Hujan (+5rb)</label>
                </div>
            </div>
        </div>

        <div class="panel" id="panel-extra">
            <div class="panel-header">
                <span class="panel-title-text">🛒 Jasa Belanja & Layanan Lain</span>
                <span style="font-size: 12px; color: #999;">Buka/Tutup</span>
            </div>
            <div class="panel-content">
                <div class="grid-2" style="margin-bottom: 12px;">
                    <div>
                        <label>Pasar (1rb/item)</label>
                        <input id="itemPasar" type="number" inputmode="numeric" placeholder="Qty">
                    </div>
                    <div>
                        <label>Minimarket (1rb/item)</label>
                        <input id="itemIndo" type="number" inputmode="numeric" placeholder="Qty">
                    </div>
                </div>
                
                <div class="grid-2" style="margin-bottom: 15px;">
                    <div>
                        <label>Dept. Store (2rb/item)</label>
                        <input id="itemDept" type="number" inputmode="numeric" placeholder="Qty">
                    </div>
                    <div>
                        <label>Mall/Gedung (3.5rb/item)</label>
                        <input id="itemMall" type="number" inputmode="numeric" placeholder="Qty">
                    </div>
                </div>

                <div class="section-title" style="margin-top: 0;">Layanan Tambahan</div>
                <div class="grid-2">
                    <div>
                        <label>Sesi Foto (3rb)</label>
                        <input id="qtyFoto" type="number" inputmode="numeric" placeholder="Jml Sesi">
                    </div>
                    <div>
                        <label>Parkir (2rb)</label>
                        <input id="qtyParkir" type="number" inputmode="numeric" placeholder="Kali Parkir">
                    </div>
                </div>
                
                <div class="check-list" style="margin-top: 15px;">
                    <div class="check-item"><label><input id="cekKFC" type="checkbox"> KFC/Mcd (+2rb)</label></div>
                    <div class="check-item"><label><input id="cekGacoan" type="checkbox"> Gacoan (+2rb)</label></div>
                    <div class="check-item"><label><input id="cekRS" type="checkbox"> Masuk RS (+2rb)</label></div>
                    <div class="check-item"><label><input id="cekJalan" type="checkbox"> Jalan Rusak (+5rb)</label></div>
                </div>

                <div class="section-title">Muatan & Biaya Lain</div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Extra Hati-hati (x5rb)</label>
                        <input id="itemFragile" type="number" inputmode="numeric" placeholder="Jml Barang">
                        <div class="helper">Telur, Kue Tart, Kaca, dll.</div>
                    </div>
                    <div class="form-group">
                        <label>Berat/Dus (x3rb)</label>
                        <input id="itemBerat" type="number" inputmode="numeric" placeholder="Jml Dus">
                        <div class="helper">Air Dus, Beras, Gas 3kg.</div>
                    </div>
                </div>

                <div class="check-list" style="margin-bottom: 15px;">
                    <div class="check-item">
                        <label><input id="cekAngkat" type="checkbox"> Jasa Angkat ke Ruangan (+5rb)</label>
                    </div>
                </div>

                <div class="form-group" style="background: #fff8f8; padding: 10px; border: 1px dashed #e03131; border-radius: 8px;">
                    <label style="color: #e03131;">Tambahan Manual (Driver)</label>
                    <div style="display: flex; gap: 8px;">
                        <input id="customKet" type="text" placeholder="Ket. (misal: Bawa Penumpang)" style="flex: 2; border: 1px solid #e03131;">
                        <input id="customHarga" type="number" inputmode="numeric" placeholder="Rp..." style="flex: 1; border: 1px solid #e03131;">
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-action">
            <button id="btnHitung" class="cek-button">HITUNG ONGKIR</button>
            
            <div class="tarif-display">
                <div id="hasilTarif" class="tarif-value">Rp -</div>
            </div>
            <div id="rincianTarif" class="rincian-box" style="display:none;"></div>
        </div>
    </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    // --- MAP TOGGLE ---
    function toggleMap() {
        const map = document.getElementById('myMap');
        if (map.style.display === "none" || map.style.display === "") {
            map.style.display = "block";
        } else {
            map.style.display = "none";
        }
    }

(function(){
  const tg = window.Telegram.WebApp;
  tg.expand();
  const urlParams = new URLSearchParams(window.location.search);
  const orderID = urlParams.get('oid') || "0"; 

  // --- ELEMEN ---
  const btnHitung = document.getElementById('btnHitung');
  const hasilEl = document.getElementById('hasilTarif');
  const rincianEl = document.getElementById('rincianTarif');
  
  // Inputs
  const el = {
      tarifDasar: document.getElementById('tarifDasar'),
      jarak: document.getElementById('jarakTotal'),
      online: document.getElementById('titikOnline'),
      offline: document.getElementById('titikOffline'),
      // Belanja (DIPISAH)
      pasar: document.getElementById('itemPasar'),
      indo: document.getElementById('itemIndo'),
      dept: document.getElementById('itemDept'),
      mall: document.getElementById('itemMall'),
      // Layanan Qty 
      foto: document.getElementById('qtyFoto'),
      parkir: document.getElementById('qtyParkir'),
      // Checkbox
      kfc: document.getElementById('cekKFC'),
      gacoan: document.getElementById('cekGacoan'),
      rs: document.getElementById('cekRS'),
      jalan: document.getElementById('cekJalan'),
      // Muatan
      fragile: document.getElementById('itemFragile'),
      berat: document.getElementById('itemBerat'),
      angkat: document.getElementById('cekAngkat'),
      customKet: document.getElementById('customKet'),
      customVal: document.getElementById('customHarga')
  };

  // --- LOGIKA PERHITUNGAN ---

  function hitungFareByDistance(km) {
    let base = 0;
    // RUMUS JARAK MURNI
    if (km <= 2.0) base = 8000;
    else if (km <= 3.0) base = 10000;
    else if (km <= 4.0) base = 12000;
    else if (km <= 5.0) base = 14000;
    else if (km <= 6.0) base = 16000;
    else {
        // > 6KM (Siang) -> 16rb + 2.500/km
        base = 16000 + Math.ceil(km - 6.0) * 2500;
    }
    return base;
  }

  function getNightSurcharge(hour, km) {
      let fee = 0;
      let label = "";

      // LOGIKA MALAM
      if (hour >= 18 && hour <= 21) { 
          if (km > 4) {
             let sisa = km - 4;
             if (sisa > 11) { 
                 fee += 11 * 800; 
                 fee += (sisa - 11) * 1000;
             } else {
                 fee += sisa * 800;
             }
             label = "Malam (18-22)";
          }
      } 
      else if (hour === 22) { 
          fee += 4000; 
          if (km > 4) {
              let sisa = km - 4;
              if (sisa > 6) { 
                  fee += 6 * 800;
                  fee += (sisa - 6) * 1000;
              } else {
                  fee += sisa * 800;
              }
          }
          label = "Malam (22:00)";
      }
      else if (hour === 23) { 
          fee += 5000;
          if (km > 4) fee += (km - 4) * 1000;
          label = "Malam (23:00)";
      }
      else if (hour >= 0 && hour <= 4) { 
          fee += 10000;
          if (km > 4) fee += (km - 4) * 1500;
          label = "Subuh (00-05)";
      }
      else if (hour === 5) { 
          fee += 5000;
          if (km > 4) fee += (km - 4) * 1000;
          label = "Pagi Buta (05:00)";
      }
      else if (hour === 6) { 
          fee += 4000;
          label = "Pagi (06:00)";
      }

      return { amount: Math.ceil(fee), name: label };
  }

  function hitung() {
      // MODE KIRIM
      if (btnHitung.classList.contains('ready-to-send')) {
          const h = hasilEl.innerText.replace(/[^0-9]/g, '');
          const r = Array.from(rincianEl.querySelectorAll('.rincian-row')).map(row => {
             return row.querySelector('.rincian-label').innerText + ": " + row.querySelector('.rincian-val').innerText;
          }).join(" , ");
          
          tg.sendData(h + "|" + r + "|" + orderID);
          tg.close();
          return;
      }

      // MODE HITUNG
      let tarif = 0;
      let breakdown = [];
      rincianEl.innerHTML = '';
      rincianEl.style.display = 'none';

      // 1. INPUT
      const km = parseFloat(el.jarak.value.replace(',', '.') || 0);
      const baseSelected = parseInt(el.tarifDasar.value); 
      
      if (km <= 0) { alert("Mohon isi Jarak Pengantaran"); return; }
      
      // 2. LOGIKA UTAMA: BANDINGKAN TARIF DASAR vs TARIF JARAK ASLI
      const fareByDist = hitungFareByDistance(km);
      let finalBaseFare = Math.max(baseSelected, fareByDist);
      
      tarif += finalBaseFare;
      
      let labelBase = "";
      if (baseSelected > fareByDist) {
          labelBase = `Tarif Dasar Wilayah (Min. ${baseSelected/1000}k)`;
      } else {
          labelBase = `Tarif Jarak (${km}km)`;
      }
      breakdown.push({ label: labelBase, val: finalBaseFare });


      // 3. Titik Tambahan
      const qOn = parseInt(el.online.value || 0);
      const qOff = parseInt(el.offline.value || 0);
      if(qOn > 0) { const b=qOn*4000; tarif+=b; breakdown.push({label:`Titik Online x${qOn}`, val:b}); }
      if(qOff > 0) { const b=qOff*5000; tarif+=b; breakdown.push({label:`Titik Offline x${qOff}`, val:b}); }

      // 4. Waktu (Malam)
      const now = new Date();
      const nightData = getNightSurcharge(now.getHours(), km);
      if (nightData.amount > 0) {
          tarif += nightData.amount;
          breakdown.push({ label: nightData.name, val: nightData.amount });
      }

      // 5. Cuaca
      const cuaca = document.querySelector('input[name="cuaca"]:checked').value;
      if (cuaca === 'hujan') {
          tarif += 5000; breakdown.push({ label: 'Handling Hujan', val: 5000 });
      }

      // 6. BELANJA (LOGIKA BARU DIPISAH)
      // Pasar (1rb)
      const qPasar = parseInt(el.pasar.value || 0);
      if(qPasar > 0) { 
          const b = qPasar * 1000; 
          tarif += b; 
          breakdown.push({label:`Pasar (${qPasar})`, val:b}); 
      }
      // Minimarket (1rb)
      const qIndo = parseInt(el.indo.value || 0);
      if(qIndo > 0) { 
          const b = qIndo * 1000; 
          tarif += b; 
          breakdown.push({label:`Minimarket (${qIndo})`, val:b}); 
      }
      // Dept Store
      const qDept = parseInt(el.dept.value || 0);
      if(qDept > 0) { const b=qDept*2000; tarif+=b; breakdown.push({label:`Dept. Store (${qDept})`, val:b}); }
      // Mall
      const qMall = parseInt(el.mall.value || 0);
      if(qMall > 0) { const b=qMall*3500; tarif+=b; breakdown.push({label:`Mall (${qMall})`, val:b}); }

      // 7. LAYANAN QTY 
      const qFoto = parseInt(el.foto.value || 0);
      const qParkir = parseInt(el.parkir.value || 0);

      if(qFoto > 0) { const b=qFoto*3000; tarif+=b; breakdown.push({label:`Sesi Foto x${qFoto}`, val:b}); }
      if(qParkir > 0) { const b=qParkir*2000; tarif+=b; breakdown.push({label:`Parkir x${qParkir}`, val:b}); }

      // 8. CHECKBOX SISANYA
      if (el.kfc.checked) { tarif+=2000; breakdown.push({label:'KFC/Mcd', val:2000}); }
      if (el.gacoan.checked) { tarif+=2000; breakdown.push({label:'Gacoan', val:2000}); }
      if (el.rs.checked) { tarif+=2000; breakdown.push({label:'Masuk RS', val:2000}); }
      if (el.jalan.checked) { tarif+=5000; breakdown.push({label:'Jalan Rusak', val:5000}); }

      // 9. MUATAN BERAT & CUSTOM
      // Fragile
      const qFragile = parseInt(el.fragile.value || 0);
      if(qFragile > 0) { 
          const b = qFragile * 5000; 
          tarif += b; 
          breakdown.push({label:`Extra Hati-hati x${qFragile}`, val:b}); 
      }
      // Berat
      const qBerat = parseInt(el.berat.value || 0);
      if(qBerat > 0) { 
          const b = qBerat * 3000; 
          tarif += b; 
          breakdown.push({label:`Muatan Berat x${qBerat}`, val:b}); 
      }
      // Angkat
      if(el.angkat.checked) { 
          tarif += 5000; 
          breakdown.push({label:'Jasa Angkat Barang', val:5000}); 
      }
      // Custom Manual
      const custVal = parseInt(el.customVal.value || 0);
      const custKet = el.customKet.value.trim() || "Biaya Lainnya";
      if(custVal > 0) {
          tarif += custVal;
          breakdown.push({label: custKet, val: custVal});
      }

      // RENDER HASIL
      const final = Math.ceil(tarif / 1000) * 1000;
      hasilEl.innerText = "Rp " + final.toLocaleString('id-ID');
      
      // Render Rincian
      if(breakdown.length > 0) {
          rincianEl.style.display = 'block';
          rincianEl.innerHTML = breakdown.map(x => 
              `<div class="rincian-row">
                  <span class="rincian-label">${x.label}</span>
                  <span class="rincian-val">Rp ${x.val.toLocaleString('id-ID')}</span>
               </div>`
          ).join('');
      }

      // Update Tombol
      btnHitung.innerText = "KIRIM ONGKIR KE CHAT";
      btnHitung.classList.add('ready-to-send');
  }

  // Event Listeners
  btnHitung.addEventListener('click', hitung);
  
  // Reset jika input berubah
  const allInputs = document.querySelectorAll('input, select');
  allInputs.forEach(i => i.addEventListener('input', () => {
      if (btnHitung.classList.contains('ready-to-send')) {
          btnHitung.innerText = "HITUNG ONGKIR";
          btnHitung.classList.remove('ready-to-send');
          hasilEl.innerText = "Rp -";
          rincianEl.style.display = 'none';
      }
  }));

  // Panel Logic
  const pHeader = document.querySelector('.panel-header');
  const pPanel = document.querySelector('.panel');
  pHeader.addEventListener('click', () => {
      pPanel.classList.toggle('open');
  });

})();
</script>
</body>
</html>
